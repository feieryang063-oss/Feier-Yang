name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: One-time reset of stale FTP-Deploy-Action sync state
        continue-on-error: true
        run: |
          set +e
          # The orphaned roy/meow-mouse/7am-enfant folders are already deleted
          # from the server (confirmed manually), but ftp-deploy-sync-state.json
          # still remembers them from the last successful sync and the action's
          # folder-delete routine errors out instead of skipping a folder that's
          # already gone. Force a fresh resync from a live server listing.
          curl -v -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
            "ftp://${{ secrets.FTP_SERVER }}/" --quote "DELE .ftp-deploy-sync-state.json" \
            > /tmp/curlout.txt 2>&1
          echo "curl exit code: $?"
          grep -E "^> |^< " /tmp/curlout.txt
          exit 0

      - name: Upload site/ to Hostinger over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./site/
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.DS_Store
